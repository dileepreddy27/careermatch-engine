[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careermatch-engine"
version = "0.1.0"
description = "Evidence-linked job matching and conservative resume tailoring"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "qdrant-client>=1.12,<2", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
llm = ["instructor>=1.7,<2"]
semantic = ["fastembed>=0.5,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
careermatch = "careermatch.cli:main"

[tool.setuptools.package-data]
careermatch = ["static/*", "fixtures/*"]

[tool.setuptools.packages.find]
include = ["careermatch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: requires installed Playwright Chromium"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
