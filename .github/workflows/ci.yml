name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints.txt -e '.[dev,browser,llm]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m careermatch.cli demo --output work/demo-result.json
      - run: python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-evidence
          path: |
            work/demo-result.json
            work/dashboard.png
            work/mobile.png
